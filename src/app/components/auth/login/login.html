<div class="login-wrapper d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="h4 text-primary font-weight-bold">FenixTech Admin</h2>
      <p class="text-muted">Inicia sesión en tu panel de control</p>
    </div>

 <div class="alert alert-danger py-2 text-center small fw-bold" *ngIf="errorMessage">
  <i class="bi bi-exclenv-triangle-fill me-2"></i> {{ errorMessage }}
</div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label fw-bold">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control"
          [(ngModel)]="email" 
          placeholder="admin@fenixtech.com" 
          required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-bold">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control"
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold" [disabled]="isLoading">
        <span *ngIf="!isLoading">Entrar al Panel</span>
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        <span *ngIf="isLoading" class="ms-2">Verificando...</span>
      </button>
    </form>
  </div>
</div>
